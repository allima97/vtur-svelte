name = "vturapp"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-04-19"

# Configure os bindings no Cloudflare, fora do repositorio:
#   wrangler secret put PUBLIC_SUPABASE_URL
#   wrangler secret put PUBLIC_SUPABASE_ANON_KEY
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#
# Secrets para o Cron Trigger (rebuild do read model de ranking):
#   wrangler secret put CRON_SECRET       # segredo validado pelo endpoint GET /api/v1/read-model/rebuild
#   wrangler secret put WORKER_BASE_URL   # URL base do worker, ex: https://vtur-svelte.pages.dev
#
# Nao fixe credenciais/projetos de producao neste arquivo.

# Fase 3.4 (velocidade): o banco (Supabase) fica em us-west-2 (Oregon). Sem esta
# opção o Worker roda perto do usuário (São Paulo) e CADA consulta ao banco
# atravessa o continente (~200 ms). Com ela, o Worker roda ao lado do banco:
# o usuário paga uma ida até lá por requisição e as consultas ficam em poucos ms.
# Arquivos estáticos (assets) continuam saindo do ponto mais próximo do usuário.
# Para desfazer: remova este bloco e publique de novo.
[placement]
region = "aws:us-west-2"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# KV Cache: cache distribuído compartilhado entre todas as instâncias Workers.
# Usado para broadcast de invalidação de cache cross-instance.
[[kv_namespaces]]
binding = "KV_BINDING"
id = "60fa423718914712bec4f489d41c3dd6"

# Cron Trigger: reconstrói o read model de ranking a cada 5 minutos.
# O endpoint GET /api/v1/read-model/rebuild valida o header x-cron-secret
# (configurado via: wrangler secret put CRON_SECRET)
[triggers]
# "7 6 * * *" = rodada noturna às 03:07 de Brasília (marca os meses anteriores para
# refazer; o cron de 5 min reconstrói durante a madrugada). Ver NIGHTLY_READ_MODEL_CRON
# em src/lib/server/readModelRebuild.ts — os dois valores precisam ser iguais.
crons = ["*/5 * * * *", "7 6 * * *"]
